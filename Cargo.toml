[package]
name = "halobar"
version = "0.1.0"
edition = "2024"

[dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
lyrics-crypto = "0.5.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Win32_System_SystemInformation", "Win32_System_WinRT"] }
winreg = "0.55"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
